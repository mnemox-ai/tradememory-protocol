name: Keep hosted endpoint warm

# Render's free tier spins a service down after ~15 minutes of inactivity,
# and the cold start (30-60s) is long enough that registry probes and
# uptime checks time out — that is what dragged the Smithery listing to
# 13.8% uptime. A cheap health ping every 10 minutes keeps it resident.
# Free-tier instance hours (750/month) cover one always-on service.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            https://mcp.mnemox.ai/api/v1/health)
          echo "health: $code"
          [ "$code" = "200" ] || exit 1
